# Build luci-app-device-gateway (.apk) for OpenWrt 25.12 with GitHub Actions.
#
# The package is LUCI_PKGARCH:=all (pure Lua / JS / static files), so a single
# SDK build produces one .apk that installs on every architecture. The SDK
# target below (mediatek/filogic) only decides which SDK is used to build it;
# any 25.12 SDK would produce the same file. Change SDK_TARGET / SDK_SUBTARGET
# / SDK_URL if you prefer another target's SDK.
#
# Usage:
#   1. Put this file at .github/workflows/build.yml in the repo.
#   2. Push to main (or open a PR) -> the .apk appears under Actions > Artifacts.
#   3. Tag a release, e.g. `git tag v1.0.0 && git push origin v1.0.0` ->
#      a GitHub Release is created with the .apk attached.
#
# Install on the router (OpenWrt 25.12 uses apk, not opkg):
#   apk add luci-app-device-gateway_1.0.0-r1_all.apk

name: Build .apk (OpenWrt 25.12)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  OPENWRT_VERSION: 25.12.0
  SDK_TARGET: mediatek
  SDK_SUBTARGET: filogic
  SDK_URL: https://downloads.openwrt.org/releases/25.12.0/targets/mediatek/filogic/openwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget zstd

      - name: Download OpenWrt SDK
        run: |
          curl -fLO "$SDK_URL"
          ls -lh openwrt-sdk-*.tar.zst

      - name: Extract SDK
        run: |
          tar -I zstd -xf openwrt-sdk-*.tar.zst
          echo "SDK_DIR=$(echo openwrt-sdk-*/ | sed 's:/$::')" >> "$GITHUB_ENV"

      - name: Update luci feed
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update luci
          ./scripts/feeds install luci-base

      - name: Copy package into SDK
        run: |
          mkdir -p "$SDK_DIR/package/luci-app-device-gateway"
          cp -r Makefile htdocs root "$SDK_DIR/package/luci-app-device-gateway/"

      - name: Build package
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make defconfig
          make package/luci-app-device-gateway/compile V=s

      - name: Locate .apk
        run: |
          APK=$(find "$SDK_DIR/bin/packages" -name 'luci-app-device-gateway_*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::no .apk found"; find "$SDK_DIR/bin" -type f | head -30; exit 1; }
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-device-gateway-25.12-all
          path: ${{ env.APK }}
          if-no-files-found: error

      - name: Attach .apk to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
